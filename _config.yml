title: Ahmad Saifullah
description: Portfolio & Blog — Software Developer, Trainer, Moslem Preneur, Urban Farmer
url: "https://ahsai.my.id"
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
permalink: /blog/:year/:month/:day/:title/
# Cron menulis artikel bertanggal 07:00 +0700, sementara push terjadi ~06:00 +0700.
# Tanpa future: true, Jekyll mengecualikan post bertanggal masa depan dari build.
future: true
feed:
  path: /feed.xml
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
  - scope:
      path: ""
      type: "pages"
    values:
      layout: default
