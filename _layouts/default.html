<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}" />
  <meta name="author" content="Ahmad Saifullah" />
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>

  <link rel="icon" type="image/x-icon" href="/assets/img/favicon.ico" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />

  <!-- Blog-specific styles -->
  <style>
    .blog-header {
      min-height: 40vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--gradient-hero);
      position: relative;
      overflow: hidden;
      padding-top: 80px;
      text-align: center;
    }
    .blog-header::before {
      content: '';
      position: absolute;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: radial-gradient(ellipse at 30% 50%, rgba(99, 102, 241, .15) 0%, transparent 50%),
                  radial-gradient(ellipse at 70% 50%, rgba(168, 85, 247, .1) 0%, transparent 50%);
    }
    .blog-header .container { position: relative; z-index: 1; }
    .blog-header h1 {
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 800;
      letter-spacing: -1px;
    }
    .blog-card {
      background: var(--color-surface);
      border: 1px solid rgba(255, 255, 255, .06);
      border-radius: var(--radius-md);
      padding: 2rem;
      transition: all var(--transition);
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    .blog-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(99, 102, 241, .15);
      border-color: rgba(99, 102, 241, .2);
    }
    .blog-card .post-date {
      font-size: 0.85rem;
      color: var(--color-text-muted);
      margin-bottom: 0.5rem;
    }
    .blog-card h2 {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      line-height: 1.4;
    }
    .blog-card h2 a {
      color: var(--color-text);
      text-decoration: none;
      transition: color var(--transition);
    }
    .blog-card h2 a:hover {
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .blog-card .post-excerpt {
      color: var(--color-text-muted);
      font-size: 0.95rem;
      flex-grow: 1;
    }
    .blog-card .read-more {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--color-accent);
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
      margin-top: 1rem;
      transition: gap var(--transition);
    }
    .blog-card .read-more:hover { gap: 0.7rem; }
    .tag {
      display: inline-block;
      padding: 0.2rem 0.7rem;
      background: rgba(99, 102, 241, .12);
      border: 1px solid rgba(99, 102, 241, .2);
      border-radius: 2rem;
      font-size: 0.75rem;
      color: var(--color-accent);
      margin: 0.2rem;
      font-weight: 500;
    }
    .post-content {
      max-width: 800px;
      margin: 0 auto;
      font-size: 1.05rem;
      line-height: 1.9;
    }
    .post-content h1, .post-content h2, .post-content h3 {
      margin-top: 2.5rem;
      margin-bottom: 1rem;
      font-weight: 700;
    }
    .post-content h2 {
      font-size: 1.5rem;
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .post-content p { margin-bottom: 1.2rem; }
    .post-content img {
      max-width: 100%;
      border-radius: var(--radius-md);
      margin: 1.5rem 0;
    }
    .post-content blockquote {
      border-left: 3px solid var(--color-accent);
      padding: 0.8rem 1.5rem;
      margin: 1.5rem 0;
      background: rgba(99, 102, 241, .06);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      color: var(--color-text-muted);
    }
    .post-content code {
      background: rgba(99, 102, 241, .15);
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      font-size: 0.9em;
    }
    .post-content pre {
      background: var(--color-surface);
      border: 1px solid rgba(255, 255, 255, .06);
      border-radius: var(--radius-sm);
      padding: 1.2rem 1.5rem;
      overflow-x: auto;
      margin: 1.5rem 0;
    }
    .post-content pre code {
      background: none;
      padding: 0;
    }
    .post-content .video-wrapper {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: var(--radius-md);
      margin: 1.5rem 0;
    }
    .post-content .video-wrapper iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: none;
    }
    .post-content ul, .post-content ol { margin-bottom: 1.2rem; padding-left: 1.5rem; }
    .post-content li { margin-bottom: 0.4rem; }
    .post-content a { color: var(--color-accent); }
    .post-meta {
      color: var(--color-text-muted);
      font-size: 0.9rem;
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(255, 255, 255, .06);
    }
    .pagination {
      justify-content: center;
      gap: 0.5rem;
    }
    .pagination .page-item .page-link {
      background: var(--color-surface);
      border: 1px solid rgba(255, 255, 255, .06);
      color: var(--color-text);
      border-radius: var(--radius-sm);
      padding: 0.5rem 1rem;
      transition: all var(--transition);
    }
    .pagination .page-item.active .page-link {
      background: var(--gradient-primary);
      border-color: transparent;
    }
    .pagination .page-item .page-link:hover {
      border-color: var(--color-accent);
      background: rgba(99, 102, 241, .15);
    }
    .back-to-blog {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--color-text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      margin-bottom: 2rem;
      transition: color var(--transition);
    }
    .back-to-blog:hover { color: var(--color-accent); }
  </style>
</head>
<body>
  <!-- NAVIGATION -->
  <nav class="navbar navbar-expand-lg navbar-dark fixed-top" id="mainNav">
    <div class="container">
      <a class="navbar-brand" href="/">ahsailabs</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarResponsive"
        aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
        <i class="fas fa-bars"></i>
      </button>
      <div class="collapse navbar-collapse" id="navbarResponsive">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="/#portfolio">Projects</a></li>
          <li class="nav-item"><a class="nav-link" href="/#class">Classes</a></li>
          <li class="nav-item"><a class="nav-link {% if page.url contains '/blog/' %}active{% endif %}" href="/blog/">Blog</a></li>
          <li class="nav-item"><a class="nav-link" href="/#about">About</a></li>
          <li class="nav-item"><a class="nav-link" href="/#contact">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  {{ content }}

  <!-- FOOTER -->
  <footer class="footer text-center">
    <div class="container">
      <div class="row g-4">
        <div class="col-lg-4">
          <h5 class="text-uppercase">Location</h5>
          <p class="text-muted mb-0">Cipayung, Jakarta Timur<br />Jakarta 13810</p>
        </div>
        <div class="col-lg-4">
          <h5 class="text-uppercase">Around the Web</h5>
          <a class="social-link" href="https://github.com/ahsai001" target="_blank" rel="noopener" title="GitHub"><i class="fab fa-github"></i></a>
          <a class="social-link" href="https://www.instagram.com/ahsai001" target="_blank" rel="noopener" title="Instagram"><i class="fab fa-instagram"></i></a>
          <a class="social-link" href="https://www.facebook.com/ahsai001" target="_blank" rel="noopener" title="Facebook"><i class="fab fa-facebook-f"></i></a>
          <a class="social-link" href="https://www.linkedin.com/in/ahmadsaifullah/" target="_blank" rel="noopener" title="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
          <a class="social-link" href="https://ahsai001.tumblr.com" target="_blank" rel="noopener" title="Tumblr"><i class="fab fa-tumblr"></i></a>
        </div>
        <div class="col-lg-4">
          <h5 class="text-uppercase">About ahsailabs</h5>
          <p class="text-muted mb-0">Portfolio website of Ahmad Saifullah</p>
        </div>
      </div>
    </div>
  </footer>
  <div class="copyright">
    <div class="container">
      <small>&copy; <span id="year"></span> ahsai.my.id — All Rights Reserved</small>
    </div>
  </div>

  <a href="#" class="back-to-top" id="backToTop" title="Back to top">
    <i class="fas fa-chevron-up"></i>
  </a>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Back to top
    const btn = document.getElementById('backToTop');
    window.addEventListener('scroll', () => btn.classList.toggle('visible', window.scrollY > 400));
    // Copyright year
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
